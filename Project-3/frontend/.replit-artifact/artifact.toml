kind = "web"
previewPath = "/"
title = "HR Leave Management System"
version = "1.0.0"
id = "artifacts/hrms-frontend"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18206

[services.development]
run = "pnpm --filter @workspace/hrms-frontend run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hrms-frontend", "run", "build" ]
serve = "static"
publicDir = "artifacts/hrms-frontend/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18206"
BASE_PATH = "/"
